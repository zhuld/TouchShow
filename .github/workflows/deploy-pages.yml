name: Deploy to GitHub Pages

# 把前端静态站点（展示页 + 管理页 + public 运行时资源）发布到 GitHub Pages：
# https://zhuld.github.io/TouchShow/
# 说明：GitHub Pages 仅托管静态文件，Rust 后端（远程配置/上传/串口等 API）无法部署，
# 线上为静态演示模式 —— 展示页通过 /config.json 降级加载配置，远程管理功能需本地运行后端。

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只保留一次部署，新推送取消进行中的旧部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 以 /TouchShow/ 为基础路径构建（config.json、Models、products 等运行时
      # 资源地址会自动拼接该前缀，见 src/base.ts 的 withBase）
      - name: Build frontend
        run: npm run build:pages

      # 运行时资源（config.json / products / Models / icons / favicon）由后端
      # EXE 外部加载，构建不打包进 dist；Pages 部署需随静态站点一并发布
      - name: Copy public assets
        run: |
          cp -r public/. dist/
          touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Enable GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - id: deployment
        uses: actions/deploy-pages@v4
