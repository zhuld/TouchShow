[package]
name = "touchshow"
version = "0.1.0"
description = "TouchShow 3D 展览展示触控应用"
authors = ["TouchShow"]
edition = "2021"

# Tauri v2 需要 lib crate（供移动端/插件使用），保持默认三 target 即可
[lib]
name = "touchshow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 精简 release 体积
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
