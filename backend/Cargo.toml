[package]
name = "touchshow-server"
version = "1.0.0"
edition = "2021"
description = "TouchShow Rust 后端服务（替代原 node server.cjs）"
license = "MIT"

[[bin]]
name = "touchshow-server"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "fs", "time", "sync", "io-util", "process"] }
axum = { version = "0.8", features = ["ws", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mime_guess = "2"
percent-encoding = "2"
uuid = { version = "1", features = ["v4"] }
serialport = "4"
if-addrs = "0.13"
bytes = "1"
futures-util = "0.3"
include_dir = "0.7"

# 精简 release 体积
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
